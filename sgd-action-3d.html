if(mode==='survival')for(let i=0;i<22;i++){let x,z;do{x=(Math.random()-.5)*170;z=(Math.random()-.5)*170}while(blocked(x,z));pickup(x,z,i%3===0?'health':'ammo')}
const car=new T.Group();if(mode==='city'){const base=new T.Mesh(new T.BoxGeometry(2,1,4),mat(0x293c50,.3,.65));base.position.y=.8;car.add(base);const roof=new T.Mesh(new T.BoxGeometry(1.8,.8,2),mat(0x17252e,.2,.5));roof.position.y=1.65;car.add(roof);for(const x of [-1,1])for(const z of [-1.25,1.25]){const wheel=new T.Mesh(new T.CylinderGeometry(.42,.42,.25,12),mat(0x151718));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.45,z);car.add(wheel)}car.position.set(5,0,55);scene.add(car)}

let stickId=null;hold($('stick'),e=>{stickId=e.pointerId;stick(e)},()=>{stickId=null;joy={x:0,y:0};$('knob').style.transform=''});function stick(e){const r=$('stick').getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/42,y=(e.clientY-r.top-r.height/2)/42;const n=Math.max(1,Math.hypot(x,y));joy={x:x/n,y:y/n};$('knob').style.transform=`translate(${joy.x*34}px,${joy.y*34}px)`}$('stick').onpointermove=e=>{if(e.pointerId===stickId)stick(e)};
let look=null;renderer.domElement.onpointerdown=e=>{if(!running)return;if(e.pointerType==='mouse'){renderer.domElement.requestPointerLock?.();firing=true}else{look={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)}};renderer.domElement.onpointermove=e=>{if(!running)return;if(document.pointerLockElement){yaw-=e.movementX*.0025*(aiming?.45:1);pitch-=e.movementY*.0025*(aiming?.45:1)}else if(look?.id===e.pointerId){const sensitivity=Number($('sensitivity').value)/14000*(aiming?.45:1);yaw-=(e.clientX-look.x)*sensitivity;pitch-=(e.clientY-look.y)*sensitivity;look.x=e.clientX;look.y=e.clientY}pitch=Math.max(-1.3,Math.min(1.3,pitch))};renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>{look=null;firing=false};
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='KeyE'&&!e.repeat)use();if(e.code==='KeyC'&&!e.repeat)crouch=!crouch;if(e.code==='Escape')pause()});window.addEventListener('keyup',e=>keys[e.code]=false);
$('title').textContent={arena:'S.G.D. Arena 3D',city:'S.G.D. City Ops 3D',survival:'S.G.D. Survival 3D'}[mode];$('intro').textContent=({arena:'Schalte alle 6 Bots aus. Nutze Betonwände und niedrige Deckungen.',city:'Berge den goldenen Datenkoffer am nördlichen Ende der Straße und erreiche den blauen Abholkreis im Süden. Mit E oder Fahrzeug einsteigen.',survival:'Überlebe als letzter Agent gegen 13 Bots. Sammle Munition und Medipacks. Der blaue Sicherheitskreis schrumpft.'}[mode])+' Computer: WASD bewegen, Maus zielen, Klicken/Leertaste feuern, R laden, C ducken. Handy: linker Stick bewegen, über die freie Bildfläche wischen zum Zielen. Solo gegen Bots. Controller: linker Stick laufen, rechter Stick zielen, RT feuern, LT zielen, X laden, A Fahrzeug, B ducken, L3 sprinten. Zielen und Sprint auch über die Touch-Tasten.';$('start').disabled=false;$('start').textContent='Einsatz starten';$('start').onclick=()=>{running=true;$('menu').style.display='none';if(!('ontouchstart'in window))renderer.domElement.requestPointerLock?.()};$('use').hidden=mode!=='city';
function updateInstruments(){const angle=((yaw*180/Math.PI)%360+360)%360;$('compass').textContent=['N','W','S','O'][Math.round(angle/90)%4]+' · '+Math.round(angle)+'°'+(gamepadActive?' · CONTROLLER':'');$('aim').classList.toggle('active',aiming);$('sprint').classList.toggle('active',sprinting);const c=$('map').getContext('2d');c.clearRect(0,0,160,160);c.fillStyle='#0c1b25';c.beginPath();c.arc(80,80,79,0,7);c.fill();c.save();c.beginPath();c.arc(80,80,76,0,7);c.clip();const scale=mode==='arena'?1.7:.65;c.translate(80,80);c.rotate(yaw);c.translate(-pos.x*scale,-pos.z*scale);c.fillStyle='#70818c';for(const b of solids)c.fillRect((b.x-b.w)*scale,(b.z-b.d)*scale,b.w*2*scale,b.d*2*scale);c.fillStyle='#d79075';for(const b of bots)if(b.hp>0){c.beginPath();c.arc(b.g.position.x*scale,b.g.position.z*scale,2,0,7);c.fill()}if(mode==='city'){c.fillStyle='#f5cd6c';c.fillRect(-2,(collected?72:-76)*scale-2,4,4)}c.restore();c.fillStyle='#e9f4f2';c.beginPath();c.moveTo(80,73);c.lineTo(76,85);c.lineTo(84,85);c.fill()}
function pollPad(dt){const pad=Array.from(navigator.getGamepads?.()||[]).find(Boolean);gamepadActive=!!pad;if(!pad){gamepadMove.x=gamepadMove.y=0;return}const axis=v=>Math.abs(v)<.16?0:Math.sign(v)*(Math.abs(v)-.16)/.84;gamepadMove.x=axis(pad.axes[0]||0);gamepadMove.y=axis(pad.axes[1]||0);yaw-=axis(pad.axes[2]||0)*dt*2.3*(aiming?.45:1);pitch-=axis(pad.axes[3]||0)*dt*1.8*($('invert').checked?-1:1);pitch=Math.max(-1.3,Math.min(1.3,pitch));firing=!!pad.buttons[7]?.pressed;aiming=!!pad.buttons[6]?.pressed;sprinting=!!pad.buttons[10]?.pressed;for(const [i,fn] of [[2,reload],[0,use],[1,()=>crouch=!crouch],[9,pause]])if(pad.buttons[i]?.pressed&&!padButtons[i])fn();padButtons=pad.buttons.map(b=>b.pressed)}
function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;if(running){pollPad(dt);elapsed+=dt;if(reloading){reloading-=dt;if(reloading<=0){reloading=0;let n=Math.min(24-ammo,reserve);ammo+=n;reserve-=n}}const x=joy.x+gamepadMove.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=joy.y+gamepadMove.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),len=Math.max(1,Math.hypot(x,z)),speed=(driving?19:crouch?2.6:aiming?3:(sprinting||keys.ShiftLeft)?9:6)*dt;move(pos,(x*Math.cos(yaw)+z*Math.sin(yaw))/len*speed,(-x*Math.sin(yaw)+z*Math.cos(yaw))/len*speed);if(driving){car.position.copy(pos);car.rotation.y=yaw;car.visible=false}else car.visible=true;
camera.position.set(pos.x,driving?1.8:crouch?1:1.8,pos.z);camera.rotation.set(pitch,yaw,0);camera.fov+=((aiming&&!driving?48:72)-camera.fov)*Math.min(1,dt*12);camera.updateProjectionMatrix();weapon.position.x+=((aiming?.02:.27)-weapon.position.x)*.18;weapon.position.y=(aiming?-.17:-.23)+Math.sin(elapsed*10)*Math.min(1,Math.hypot(x,z))*.008;weapon.visible=!driving;weapon.position.z+=( -.58-weapon.position.z)*.3;if(firing||keys.Space)shoot();
for(const b of bots){if(b.hp<=0)continue;const delta=pos.clone().sub(b.g.position),d=delta.length(),sight=d<65&&clearLine(b.g.position.clone().setY(1.5),camera.position);b.g.rotation.y=Math.atan2(-delta.x,-delta.z);b.phase+=dt*7;b.g.children[3].rotation.x=Math.sin(b.phase)*.3;b.g.children[4].rotation.x=-Math.sin(b.phase)*.3;if(d>8){const speed=dt*(mode==='survival'?2.9:2.2);const old=b.g.position.clone();move(b.g.position,delta.x/d*speed,delta.z/d*speed);if(old.distanceTo(b.g.position)<.01)move(b.g.position,Math.cos(b.phase/7)*speed,Math.sin(b.phase/7)*speed)}b.shot-=dt;if(sight&&b.shot<=0){b.shot=1.1+Math.random()*1.7;if(Math.random()<(crouch?.35:.7))hp-=driving?2:7}}
for(let i=loot.length-1;i>=0;i--){const l=loot[i];l.o.rotation.y+=dt;if(pos.distanceTo(l.o.position)<2.2){if(l.type==='health')hp=Math.min(100,hp+35);else reserve+=36;scene.remove(l.o);loot.splice(i,1)}}
if(mode==='city'){if(!collected&&pos.distanceTo(intel.position)<3){collected=true;scene.remove(intel);say('Daten gesichert! Zurück zum blauen Abholkreis.')}if(collected&&Math.hypot(pos.x,pos.z-72)<3.4)finish(true)}
let radius=Math.max(12,105-elapsed*.35);if(mode==='survival'){zone.scale.set(radius,radius,1);if(Math.hypot(pos.x,pos.z)>radius)hp-=dt*8;for(const b of bots)if(b.hp>0&&Math.hypot(b.g.position.x,b.g.position.z)>radius){b.hp-=dt*8;if(b.hp<=0)scene.remove(b.g)}}
const alive=bots.filter(b=>b.hp>0).length;if(hp<previousHP){$('damage').style.opacity='.55';setTimeout(()=>$('damage').style.opacity='0',180)}previousHP=hp;updateInstruments();if(hp<=0)finish(false);else if(mode!=='city'&&alive===0)finish(true);$('stats').innerHTML=`<b>${{arena:'ARENA 3D',city:'CITY OPS 3D',survival:'SURVIVAL 3D'}[mode]}</b> · ${Math.max(0,Math.ceil(hp))} Gesundheit<br>${reloading?'Nachladen …':ammo+' / '+reserve+' Munition'} · ${alive} Gegner${mode==='survival'?' · Zone '+Math.floor(radius)+' m':''}${driving?' · Im Fahrzeug':''}${crouch?' · Geduckt':''}`;if(mode==='city')say(collected?'Daten gesichert → Abholkreis im Süden (blaue Markierung)':'Auftrag: Datenkoffer im Norden bergen · Fahrzeug am Start');else say(mode==='survival'?'Im blauen Kreis bleiben · Ausrüstung beim Berühren sammeln':'Alle Bots ausschalten · Hinter Wänden in Deckung gehen');}
for(let i=effects.length-1;i>=0;i--){effects[i].time-=dt;if(effects[i].time<=0){scene.remove(effects[i].line);effects[i].line.geometry.dispose();effects[i].line.material.dispose();effects.splice(i,1)}}renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});camera.position.set(pos.x,1.8,pos.z);requestAnimationFrame(tick);
