function agent(x,z){const g=new T.Group(),body=new T.Mesh(new T.BoxGeometry(.65,.95,.4),dark);body.position.y=1.15;g.add(body);const vest=new T.Mesh(new T.BoxGeometry(.72,.65,.48),mat(0x5c695e));vest.position.y=1.2;g.add(vest);const head=new T.Mesh(new T.SphereGeometry(.23,12,8),mat(0xbba58a));head.position.y=1.91;g.add(head);for(const s of [-1,1]){const leg=new T.Mesh(new T.BoxGeometry(.24,.72,.27),dark);leg.position.set(s*.2,.4,0);g.add(leg);const arm=new T.Mesh(new T.BoxGeometry(.2,.75,.23),dark);arm.position.set(s*.46,1.2,-.12);g.add(arm)}const gun=new T.Mesh(new T.BoxGeometry(.13,.17,.85),steel);gun.position.set(.35,1.3,-.52);g.add(gun);g.position.set(x,0,z);scene.add(g);return {g,hp:100,shot:1+Math.random()*2,phase:Math.random()*6}}

function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;if(running){elapsed+=dt;if(reloading){reloading-=dt;if(reloading<=0){reloading=0;let n=Math.min(24-ammo,reserve);ammo+=n;reserve-=n}}const x=joy.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=joy.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),len=Math.max(1,Math.hypot(x,z)),speed=(driving?19:crouch?2.6:6)*dt;move(pos,(x*Math.cos(yaw)+z*Math.sin(yaw))/len*speed,(-x*Math.sin(yaw)+z*Math.cos(yaw))/len*speed);if(driving){car.position.copy(pos);car.rotation.y=yaw;car.visible=false}else car.visible=true;
